# =============================================================================
# PRIMARY pipeline: build in the cloud, then deploy to an AWS EC2 VM over SSH.
# GitHub's cloud runner SSHes into the instance and runs a blue-green swap
# behind nginx (public port 80), so a bad deploy can't take the site down.
# =============================================================================

name: deploy-ec2

on:
  push:
    branches: [ "main" ]      # this file OWNS push now (Windows one is manual)
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Full commit SHA to redeploy (leave blank = deploy latest build)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write             # to push the image to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # BUILD: same as before -- build the image, push SHA + latest tags to ghcr.io
  # ---------------------------------------------------------------------------
  build-and-push:
    if: ${{ github.event.inputs.rollback_sha == '' }}   # rollback skips build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase the image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # DEPLOY: SSH into EC2 and run the blue-green swap ON the VM.
  # The image is PUBLIC, so the VM pulls it with no login.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || github.event.inputs.rollback_sha != '') }}
    runs-on: ubuntu-latest       # GitHub's cloud runner -- it SSHes to the VM
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      # Work out the exact image ref here (rollback SHA or this commit's SHA),
      # then bake it into the remote script below.
      - name: Compute image ref
        id: ref
        run: |
          IMAGE="${GITHUB_REPOSITORY,,}"
          SHA="${{ github.event.inputs.rollback_sha }}"
          if [ -z "$SHA" ]; then SHA="$GITHUB_SHA"; fi
          echo "ref=${REGISTRY}/${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}      # Elastic IP / public DNS
          username: ${{ secrets.EC2_USER }}  # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}    # contents of deploy.pem
          script: |
            set -e
            REF="${{ steps.ref.outputs.ref }}"
            echo "Target image: $REF"

            docker pull "$REF"

            # Private network for app + nginx (create once).
            docker network inspect appnet >/dev/null 2>&1 || docker network create appnet

            # Which color is live now? Bring up the OTHER one.
            if docker ps -q -f "name=^cicd-poc-blue$" | grep -q .; then
              OLD=blue;  NEW=green
            elif docker ps -q -f "name=^cicd-poc-green$" | grep -q .; then
              OLD=green; NEW=blue
            else
              OLD="";    NEW=blue
            fi
            NEW_NAME="cicd-poc-$NEW"
            echo "Old color: '$OLD'  ->  New color: '$NEW'"

            # Clear a stale container with the new name, then start NEW color.
            # No -p: nginx reaches it by name over the private network.
            docker ps -aq -f "name=^${NEW_NAME}$" | grep -q . && docker rm -f "$NEW_NAME" || true
            docker run -d --name "$NEW_NAME" --network appnet --restart unless-stopped "$REF"

            # Health-check NEW color BEFORE any traffic hits it. Uses the app's
            # own python (no curl in image). If it crashed on boot, we never
            # switch nginx and the old color keeps serving -> zero downtime.
            HEALTHY=0
            for i in $(seq 1 15); do
              if docker exec "$NEW_NAME" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)" >/dev/null 2>&1; then
                HEALTHY=1; break
              fi
              echo "waiting for $NEW_NAME to be healthy... ($i)"
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "NEW color never became healthy. Aborting WITHOUT switching."
              docker logs "$NEW_NAME" || true
              docker rm -f "$NEW_NAME" || true
              exit 1
            fi
            echo "$NEW_NAME is healthy."

            # Write nginx config pointing at the NEW color. \$host / \$remote_addr
            # are escaped so the shell leaves them for nginx.
            cat > /tmp/default.conf <<EOF
            upstream app { server ${NEW_NAME}:8000; }
            server {
              listen 80;
              location / {
                proxy_pass http://app;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
              }
            }
            EOF

            # Start nginx on host port 80 the first time; otherwise just reload.
            if ! docker ps -aq -f "name=^cicd-edge$" | grep -q .; then
              echo "Starting nginx edge on port 80"
              docker run -d --name cicd-edge --network appnet --restart unless-stopped -p 80:80 nginx:1.27-alpine
              sleep 2
            fi
            docker cp /tmp/default.conf cicd-edge:/etc/nginx/conf.d/default.conf
            # Graceful reload: new workers on new config, old workers drain.
            docker exec cicd-edge nginx -s reload
            echo "nginx now routing to $NEW_NAME."

            # Drain and retire the OLD color.
            if [ -n "$OLD" ]; then
              echo "Draining cicd-poc-$OLD for 30s..."
              sleep 30
              docker rm -f "cicd-poc-$OLD" || true
              echo "Old color removed."
            fi

            echo "Deployed $REF with zero downtime (active color: $NEW)."
