# =============================================================================
# CI/CD pipeline: build the Docker image and push it to GitHub Container Registry
# =============================================================================
# This is the "CI" half + the image-publish half of "CD".
# The actual deploy (pull + run on your self-hosted runner) gets added next.

name: build-and-push          # shows up as the workflow name in the Actions tab

# ---- TRIGGER: when does this run? -------------------------------------------
on:
  push:
    branches: [ "main" ]      # every push to main
  workflow_dispatch:          # + a manual "Run workflow" button in the UI

# ---- PERMISSIONS: what the auto-provided GITHUB_TOKEN is allowed to do -------
# 'packages: write' lets us push an image to ghcr.io. Least-privilege on purpose.
permissions:
  contents: read
  packages: write

# ---- Reusable values --------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourname/cicd-pipeline-project

jobs:
  build-and-push:
    runs-on: ubuntu-latest              # a free GitHub-HOSTED runner (cloud)

    # Expose the lowercase image name so the deploy job (below) can reuse it.
    outputs:
      image: ${{ steps.img.outputs.name }}

    steps:
      # 1. Get your code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Buildx = Docker's advanced builder. Its 'docker-container'
      #    driver is what makes the GitHub Actions build cache (below) work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. ghcr.io requires lowercase image names; repo owner may have capitals
      - name: Lowercase the image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # 3. Log in to GitHub Container Registry using the auto-provided token
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # created automatically, no setup

      # 4. Compute image tags: the commit SHA (immutable) AND 'latest' (moving)
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # 5. Build the image from the Dockerfile and push it to the registry
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha           # reuse build cache between runs = faster
          cache-to: type=gha,mode=max

  # ===========================================================================
  # DEPLOY: pull the freshly built image and run it as a container on YOUR box.
  # ===========================================================================
  deploy:
    needs: build-and-push               # only runs if the build job succeeded
    runs-on: self-hosted                # <-- YOUR machine, not GitHub's cloud

    # Only ONE deploy at a time. If you push twice quickly, the newer run waits
    # instead of two deploys fighting over port 8000. (Remember the puzzle?)
    concurrency:
      group: deploy-cicd-poc
      cancel-in-progress: false

    env:
      REGISTRY: ghcr.io
      IMAGE: ${{ needs.build-and-push.outputs.image }}   # from the build job
      CONTAINER_NAME: cicd-poc
      PORT: "8000"

    steps:
      # Authenticate so this machine can PULL the image (ghcr package is private
      # by default). Same token, but here it only needs read access.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The actual deploy. PowerShell = always available on a Windows runner.
      - name: Pull and run the new container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ref = "$env:REGISTRY/$env:IMAGE" + ":sha-$env:GITHUB_SHA"   # exact build
          Write-Host "Deploying $ref"

          docker pull $ref
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed" }

          # Replace the old container ONLY if it exists (no stderr = no false fail).
          $existing = docker ps -aq -f "name=^$($env:CONTAINER_NAME)$"
          if ($existing) {
            Write-Host "Stopping old container $existing"
            docker stop $env:CONTAINER_NAME | Out-Null
            docker rm   $env:CONTAINER_NAME | Out-Null
          } else {
            Write-Host "No existing container - fresh deploy"
          }

          docker run -d `
            --name $env:CONTAINER_NAME `
            --restart unless-stopped `
            -p "$($env:PORT):8000" `
            $ref
          if ($LASTEXITCODE -ne 0) { throw "docker run failed" }

      # Confirm the app is actually alive before calling the deploy a success.
      - name: Health check
        shell: powershell
        run: |
          for ($i = 1; $i -le 10; $i++) {
            try {
              Invoke-RestMethod -Uri "http://localhost:$($env:PORT)/health" -TimeoutSec 3 | Out-Null
              Write-Host "healthy"; exit 0
            } catch {
              Write-Host "waiting for app... ($i)"; Start-Sleep -Seconds 2
            }
          }
          Write-Host "App never became healthy - dumping logs:"
          docker logs $env:CONTAINER_NAME
          exit 1
