# =============================================================================
# CI/CD pipeline: build the Docker image and push it to GitHub Container Registry
# =============================================================================
# This is the "CI" half + the image-publish half of "CD".
# The actual deploy (pull + run on your self-hosted runner) gets added next.

name: build-and-push          # shows up as the workflow name in the Actions tab

# ---- TRIGGER: when does this run? -------------------------------------------
on:
  push:
    branches: [ "main" ]      # every push to main
  workflow_dispatch:          # + a manual "Run workflow" button in the UI
    inputs:
      rollback_sha:
        description: "Full commit SHA to redeploy (leave blank = deploy latest build)"
        required: false
        default: ""

# ---- PERMISSIONS: what the auto-provided GITHUB_TOKEN is allowed to do -------
# 'packages: write' lets us push an image to ghcr.io. Least-privilege on purpose.
permissions:
  contents: read
  packages: write

# ---- Reusable values --------------------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourname/cicd-pipeline-project

jobs:
  build-and-push:
    # On a rollback we redeploy an OLD image that already exists in ghcr.io,
    # so there's nothing to build. Skip this whole job in that case.
    if: ${{ github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest              # a free GitHub-HOSTED runner (cloud)

    # Expose the lowercase image name so the deploy job (below) can reuse it.
    outputs:
      image: ${{ steps.img.outputs.name }}

    steps:
      # 1. Get your code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Buildx = Docker's advanced builder. Its 'docker-container'
      #    driver is what makes the GitHub Actions build cache (below) work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. ghcr.io requires lowercase image names; repo owner may have capitals
      - name: Lowercase the image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # 3. Log in to GitHub Container Registry using the auto-provided token
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # created automatically, no setup

      # 4. Compute image tags: the commit SHA (immutable) AND 'latest' (moving)
      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # 5. Build the image from the Dockerfile and push it to the registry
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha           # reuse build cache between runs = faster
          cache-to: type=gha,mode=max

  # ===========================================================================
  # DEPLOY: zero-downtime blue-green swap behind an nginx reverse proxy.
  # nginx owns the public port 8000. App containers ("blue"/"green") sit on an
  # internal network; nginx routes to whichever is live. We bring the NEW color
  # up, health-check it, flip nginx to it, then drain and retire the OLD color.
  # ===========================================================================
  deploy:
    needs: build-and-push
    # Run after a successful build, OR when this is a rollback (build skipped).
    if: ${{ always() && (needs.build-and-push.result == 'success' || github.event.inputs.rollback_sha != '') }}
    runs-on: self-hosted                # <-- YOUR machine, not GitHub's cloud

    # One deploy at a time so two swaps never interleave.
    concurrency:
      group: deploy-cicd-poc
      cancel-in-progress: false

    env:
      REGISTRY: ghcr.io
      NETWORK: appnet                    # private docker network for app + nginx
      EDGE: cicd-edge                    # the nginx container (public entrypoint)
      PORT: "8000"                       # public port users hit
      DRAIN_SECONDS: "30"                # how long the old color finishes requests
      ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Blue-green deploy
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # --- Which image + tag are we deploying? -----------------------------
          # Rollback: use the SHA typed in the UI. Normal: use this commit's SHA.
          $image = $env:GITHUB_REPOSITORY.ToLower()
          $sha   = if ($env:ROLLBACK_SHA) { $env:ROLLBACK_SHA } else { $env:GITHUB_SHA }
          $ref   = "${env:REGISTRY}/${image}:sha-${sha}"
          Write-Host "Target image: $ref"

          docker pull $ref
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed" }

          # --- Ensure the private network exists -------------------------------
          docker network inspect $env:NETWORK *> $null
          if ($LASTEXITCODE -ne 0) { docker network create $env:NETWORK | Out-Null }

          # --- Decide colors: what's live now, what we're bringing up ----------
          $blueUp  = docker ps -q -f "name=^cicd-poc-blue$"
          $greenUp = docker ps -q -f "name=^cicd-poc-green$"
          if     ($blueUp)  { $old = "blue";  $new = "green" }
          elseif ($greenUp) { $old = "green"; $new = "blue"  }
          else              { $old = "";      $new = "blue"  }   # first deploy
          $newName = "cicd-poc-$new"
          Write-Host "Old color: '$old'  ->  New color: '$new'"

          # Clear any stale container with the new name, then start NEW color.
          # No host port: nginx reaches it by name over the private network.
          $stale = docker ps -aq -f "name=^$newName$"
          if ($stale) { docker rm -f $newName | Out-Null }
          docker run -d --name $newName --network $env:NETWORK --restart unless-stopped $ref
          if ($LASTEXITCODE -ne 0) { throw "docker run failed" }

          # --- Health-check the NEW color BEFORE any traffic touches it --------
          # We exec the app's own python (curl isn't in the image). If the app
          # crashed on boot (e.g. bad import), exec fails -> we NEVER switch,
          # and the old color keeps serving. That's the zero-downtime guarantee.
          $healthy = $false
          for ($i = 1; $i -le 15; $i++) {
            docker exec $newName python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)" *> $null
            if ($LASTEXITCODE -eq 0) { $healthy = $true; break }
            Write-Host "waiting for $newName to be healthy... ($i)"
            Start-Sleep -Seconds 2
          }
          if (-not $healthy) {
            Write-Host "NEW color never became healthy. Aborting WITHOUT switching."
            Write-Host "----- logs from $newName -----"
            docker logs $newName
            docker rm -f $newName | Out-Null
            throw "Deploy aborted; old version still live, zero downtime."
          }
          Write-Host "$newName is healthy."

          # --- Point nginx at the NEW color ------------------------------------
          # Backticks escape $host/$remote_addr so PowerShell doesn't eat them.
          $conf = @"
          upstream app { server ${newName}:8000; }
          server {
            listen 80;
            location / {
              proxy_pass http://app;
              proxy_set_header Host `$host;
              proxy_set_header X-Real-IP `$remote_addr;
            }
          }
          "@
          $confPath = Join-Path $env:RUNNER_TEMP "default.conf"
          $conf | Out-File -FilePath $confPath -Encoding ascii

          $edgeExists = docker ps -aq -f "name=^$($env:EDGE)$"
          if (-not $edgeExists) {
            Write-Host "Starting nginx edge on port $env:PORT"
            docker run -d --name $env:EDGE --network $env:NETWORK --restart unless-stopped -p "$($env:PORT):80" nginx:1.27-alpine | Out-Null
            Start-Sleep -Seconds 2
          }
          docker cp $confPath "$($env:EDGE):/etc/nginx/conf.d/default.conf"
          # Graceful reload: nginx spins up new workers on the new config and lets
          # old workers finish their in-flight requests. This is the atomic switch.
          docker exec $env:EDGE nginx -s reload
          Write-Host "nginx now routing to $newName."

          # --- Drain and retire the OLD color ----------------------------------
          if ($old) {
            Write-Host "Draining old color cicd-poc-$old for $env:DRAIN_SECONDS s..."
            Start-Sleep -Seconds ([int]$env:DRAIN_SECONDS)
            docker rm -f "cicd-poc-$old" | Out-Null
            Write-Host "Old color removed."
          }

          Write-Host "Deployed $ref with zero downtime (active color: $new)."

      # Final external check: hit the PUBLIC url through nginx.
      - name: Verify public endpoint
        shell: powershell
        run: |
          Invoke-RestMethod -Uri "http://localhost:$($env:PORT)/health" -TimeoutSec 5
          Write-Host "Public endpoint healthy."
